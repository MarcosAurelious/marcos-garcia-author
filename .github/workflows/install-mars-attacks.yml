name: Install Mars shield punch and side kick sprites

on:
  push:
    branches: [main]
    paths:
      - 'fight/mars-attacks-v55.zip'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  install-mars:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Pillow
        run: python -m pip install 'Pillow>=11,<13'
      - name: Validate and extract both sprite atlases
        run: |
          python - <<'PY'
          from zipfile import ZipFile
          from pathlib import Path
          from PIL import Image
          import io
          file = Path('fight/mars-attacks-v55.zip')
          if not file.is_file():
              raise SystemExit('Upload fight/mars-attacks-v55.zip to install artwork.')
          destination=Path('fight/attacks')
          destination.mkdir(exist_ok=True,parents=True)
          with ZipFile(file) as bundle:
              for name in ['mars_heavy.png','mars_hkick.png']:
                  entry='fight/attacks/'+name
                  data=bundle.read(entry)
                  im=Image.open(io.BytesIO(data))
                  if im.mode != 'RGBA' or im.size != (2560,320):
                      raise RuntimeError(f'Invalid atlas: {entry}, {im.mode}, {im.size}')
                  for i in range(8):
                      frame=im.crop((i*320,0,(i+1)*320,320))
                      bb=frame.getchannel('A').getbbox()
                      if not bb or bb[0]<=0 or bb[1]<=0 or bb[2]>=320 or bb[3]>=320:
                          raise RuntimeError(f'Clipped or empty frame: {entry} [{i}]: {bb}')
                  (destination/name).write_bytes(data)
                  print('Verified',entry,'8 frames')
      - name: Commit both atlases
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add fight/attacks/mars_heavy.png fight/attacks/mars_hkick.png
          if ! git diff --cached --quiet; then
            git commit -m "Install Mars heavy shield punch and side kick painted sprite atlases"
            git push
          fi
