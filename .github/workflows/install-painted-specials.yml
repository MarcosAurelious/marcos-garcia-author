name: Install painted Roman Arena special sprites
on:
  push:
    branches: [main]
    paths:
      - 'fight/painted-specials-v54.zip'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  install-specials:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Pillow
        run: python -m pip install 'Pillow>=11,<13'
      - name: Unpack and validate 13 illustrated specials
        run: |
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          from PIL import Image
          import io
          archive=Path('fight/painted-specials-v54.zip')
          if not archive.is_file():
              raise SystemExit('Upload fight/painted-specials-v54.zip to run this installer.')
          names='marcus mars colossus medusa minotaur vulcan chiron diana cerberus pegasus helios neptune hades'.split()
          target=Path('fight/specials/painted')
          target.mkdir(parents=True,exist_ok=True)
          with ZipFile(archive) as z:
              for id in names:
                  for suffix,size in [('special',(2688,160)),('effect',(1280,160))]:
                      name=f'fight/specials/painted/{id}_{suffix}.png'
                      if name not in z.namelist():raise SystemExit(f'Missing PNG: {name}')
                      data=z.read(name)
                      img=Image.open(io.BytesIO(data))
                      if img.mode!='RGBA' or img.size!=size:
                          raise SystemExit(f'Invalid PNG {name}: {img.size} {img.mode}')
                      if not img.getchannel('A').getextrema()[0]<255:
                          raise SystemExit(f'No transparency {name}')
                      (target/f'{id}_{suffix}.png').write_bytes(data)
          print('Validated 26 illustrated atlases, 13 fighters.')
          PY
      - name: Publish new assets and remove upload ZIP
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add fight/specials/painted/
          git rm -f fight/painted-specials-v54.zip
          if ! git diff --cached --quiet; then
            git commit -m "Publish 13 painterly Roman Arena special animations and effects"
            git push
          fi
