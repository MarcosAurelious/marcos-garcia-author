name: Generate Roman Arena sprite atlases

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'fight/tools/generate_sprites.py'

permissions:
  contents: write

jobs:
  build-sprites:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Pillow
        run: python -m pip install 'Pillow>=11,<13'
      - name: Generate all 13 sprite atlases
        run: python fight/tools/generate_sprites.py
      - name: Validate files
        run: |
          test -f fight/generated/atlas-data.js
          test -f fight/cutins/atlas-data.js
          test "$(find fight/generated -name '*.webp' | wc -l)" -eq 13
          test "$(find fight/cutins -name '*.webp' | wc -l)" -eq 13
          python - <<'PY'
          import re
          from pathlib import Path
          data=Path('fight/generated/atlas-data.js').read_text()
          assert len(re.findall(r'"g_[a-z]+"',data))==13
          for f in Path('fight/generated').glob('*.webp'):
              assert f.stat().st_size > 5000, f
          print('13 sprite sheets validated')
          PY
      - name: Commit generated sprite assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add fight/generated/ fight/cutins/
          if ! git diff --cached --quiet; then
            git commit -m "Generate animation atlases and 13 cinematic special sprite strips"
            git push
          fi
